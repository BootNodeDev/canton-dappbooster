sdk-version: 3.4.11
name: amulet-vesting
source: .
version: 0.0.1
dependencies:
  - daml-prim
  - daml-stdlib
# Fetched by scripts/fetch-daml-deps.mjs, which drops the version from each filename so a
# Splice bump moves no path here.
data-dependencies:
  - deps/splice-amulet.dar
  - deps/splice-api-token-holding-v1.dar
  - deps/splice-api-token-metadata-v1.dar
  - deps/splice-api-token-transfer-instruction-v1.dar
# 2.1 is what the Splice deps are built at, and a data-dependency cannot be read from a
# different LF target.
build-options:
  - --target=2.1
