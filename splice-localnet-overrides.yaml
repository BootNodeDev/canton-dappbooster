# Local guardrails for Splice LocalNet without modifying the downloaded checkout.
#
# This is a Docker Compose override: the wrapper passes it as an extra `-f` after
# Splice's own compose files, and Compose merges the two service-by-service. This
# static file only sets log rotation. It is scaffolded into your project by `init`,
# so you can add your own tweaks here.
#
# There is also a SECOND, STATIC override shipped inside the canton-barebones
# package (templates/runtime-overrides.yaml, always applied right before this
# file): driven purely by env vars from .generated/localnet.env, it blanks a
# headless validator's nginx route template and turns the `sv` config flags into
# 0-replica pins and nginx aliases for the SV web UIs. See that file's header for
# the full mechanics, and writeLocalnetEnv in src/compose.js for the env values.
services:
  postgres:
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  nginx:
    logging: *default-logging

  canton:
    logging: *default-logging
    environment:
      LOG_LEVEL_STDOUT: "${LOG_LEVEL:-INFO}"
      LOG_LEVEL_CANTON: "${LOG_LEVEL:-INFO}"

  splice:
    logging: *default-logging
    environment:
      LOG_LEVEL_STDOUT: "${LOG_LEVEL:-INFO}"
      LOG_LEVEL_CANTON: "${LOG_LEVEL:-INFO}"

  console:
    logging: *default-logging

  multi-sync-startup:
    logging: *default-logging

  multi-sync-ready:
    logging: *default-logging

  swagger-ui:
    logging: *default-logging

  wallet-web-ui-app-user:
    logging: *default-logging

  ans-web-ui-app-user:
    logging: *default-logging

  wallet-web-ui-app-provider:
    logging: *default-logging

  ans-web-ui-app-provider:
    logging: *default-logging

  wallet-web-ui-sv:
    logging: *default-logging

  sv-web-ui:
    logging: *default-logging

  scan-web-ui:
    logging: *default-logging
