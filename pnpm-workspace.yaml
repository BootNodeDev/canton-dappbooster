# allows to use local package folders if versions are within range, fetch from npm if not
linkWorkspacePackages: true

packages:
  - canton-connect
  - canton-dappbooster
  - canton-theme
  - canton-create
  - canton-create/scaffold/*
  - example-dapps/*

# Only the localnet layer declares it; hoisted so the root scripts and `pnpm exec` reach that copy.
publicHoistPattern:
  - '@bootnodedev/canton-barebones'

# The token-forge registry's git dependency builds on install, keyed by the commit its tag resolves to.
allowBuilds:
  '@bootnodedev/canton-token-forge@https://codeload.github.com/BootNodeDev/canton-token-forge/tar.gz/1639372eb66941e505aa52399d00b8b4121953f7': true
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  protobufjs: true
  secp256k1: true

