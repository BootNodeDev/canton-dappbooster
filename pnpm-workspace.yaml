packages:
  - canton-connect
  - canton-dappbooster
  - canton-theme
  - dapp/daml
  - dapp/frontend

# Dependencies allowed to run install/build scripts (pnpm blocks them by default).
# esbuild: needed by Vite/tsx. puppeteer (via @mermaid-js/mermaid-cli): blocked so
# it does not download a Chromium; nothing here renders mermaid via the CLI.
# @bootnodedev/canton-wallet-service: a git dependency, so its `prepare` build is
# what produces the dist/ the canton-wallet-service binary points at. pnpm matches
# a git dependency only by its resolved tarball id, so moving the ref in
# package.json means replacing the commit sha below; `pnpm approve-builds` prints
# the new key.
allowBuilds:
  '@bootnodedev/canton-wallet-service@https://codeload.github.com/BootNodeDev/canton-wallet-service/tar.gz/99e7e69d2d91109e527a74a5c97c566a882de477': true
  esbuild: true
  protobufjs: true
  puppeteer: false
