# allows to use local package folders if versions are within range, fetch from npm if not
linkWorkspacePackages: true

packages:
  - canton-connect
  - canton-dappbooster
  - canton-theme
  - canton-create
  - canton-create/scaffold/*
  - example-dapps/*

# Only the localnet layer declares it; hoisted so the root scripts and `pnpm exec` reach that copy.
publicHoistPattern:
  - '@bootnodedev/canton-barebones'

allowBuilds:
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  protobufjs: true
  secp256k1: true

