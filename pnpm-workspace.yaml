packages:
  - canton-connect
  - canton-dappbooster
  - canton-theme
  - canton-barebones
  - canton-barebones/wallet-service
  - dapp/daml/vesting-lite
  - dapp/frontend

# Pins for wallet-service's wallet-sdk. Held at the versions it was verified against;
# unpinned, wallet-sdk resolves to 1.4.0 and core-acs-reader to 1.16.0, both untested here.
overrides:
  '@canton-network/wallet-sdk': 1.3.1
  '@canton-network/core-acs-reader': 1.12.0

# Dependencies allowed to run install/build scripts (pnpm blocks them by default).
# esbuild: needed by Vite/tsx. puppeteer (via @mermaid-js/mermaid-cli): blocked so
# it does not download a Chromium; nothing here renders mermaid via the CLI.
allowBuilds:
  esbuild: true
  protobufjs: true
  puppeteer: false
