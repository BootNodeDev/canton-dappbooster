# pnpm 10+ refuses to run a dependency's build script until it is listed here. protobufjs, under
# the Canton SDK, has one; the other four come with the local network's packages, and the
# token-forge registry's git dependency builds on install.
allowBuilds:
  '@bootnodedev/canton-token-forge@https://codeload.github.com/BootNodeDev/canton-token-forge/tar.gz/1639372eb66941e505aa52399d00b8b4121953f7': true
  protobufjs: true
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  secp256k1: true
