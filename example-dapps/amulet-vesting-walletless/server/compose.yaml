name: walletless

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: walletless
      POSTGRES_PASSWORD: walletless
      POSTGRES_DB: walletless
    ports:
      # scripts/server.sh sets it from DATABASE_URL; 5433, since the LocalNet's Postgres holds 5432.
      - "${WL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - walletless-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletless -d walletless"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  walletless-pg:
